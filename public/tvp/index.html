<style>
  :root { --bg:#0b0b0b; --card:#141414; --ink:#eee; --muted:#9ca3af; --accent:#7dd3fc; --line:#262626; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; background:var(--bg); color:var(--ink); }
  header { padding:28px 20px 8px; max-width:1100px; margin:0 auto; }
  header h1 { margin:0 0 6px; font-size:22px; letter-spacing:.02em; }
  header p { margin:0; color:var(--muted); font-size:13px; line-height:1.5; }
  .grid { max-width:1100px; margin:0 auto; padding:16px 20px 40px; display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:16px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; overflow:hidden; display:flex; flex-direction:column; }
  .covers { display:grid; grid-template-columns:1fr 1fr; gap:2px; background:#000; }
  .covers a { display:block; aspect-ratio:3/4; overflow:hidden; }
  .covers img { width:100%; height:100%; object-fit:cover; display:block; }
  .body { padding:14px 14px 16px; display:flex; flex-direction:column; gap:8px; flex:1; }
  .body h2 { margin:0; font-size:16px; line-height:1.35; }
  .meta { color:var(--muted); font-size:12px; }
  .links { display:flex; flex-wrap:wrap; gap:8px; margin-top:auto; padding-top:6px; }
  .links a { color:var(--accent); font-size:13px; text-decoration:none; }
  .links a:hover { text-decoration:underline; }
</style>
</head>
